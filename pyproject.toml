# --------------------------------------------------------------------------------------------------

# Setup and installation script
#
# Usage: "pip install --prefix=/path/to/install ."

# --------------------------------------------------------------------------------------------------

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jedi_bundle"
version = "1.0.40"
authors = [{name = "NASA Global Modeling and Assimilation Office"}]
description = "Tools for installing JEDI code"
readme = "README.md"
requires-python = ">=3.11"
classifiers=[
    'Development Status :: 1 - Planning',
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3 :: Only',
    'License :: OSI Approved :: Apache Software License',
    'Natural Language :: English',
    'Operating System :: OS Independent'
]

dependencies = [
    'pyyaml>=5.4',
    'pycodestyle>=2.8.0',
    'requests>=2.23.0'
]

[project.urls]
Repository = "https://github.com/geos-esm/jedi_bundle"
Documentation = "https://geos-esm.github.io/jedi_bundle/#/"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
jedi_bundle = [
    'config/*',
    'config/bundles/*',
    'config/platforms/*',
]

[project.scripts]
jedi_bundle = "jedi_bundle.bin.jedi_bundle:jedi_bundle"
jedi_bundle_update_hash = "jedi_bundle.bin.jedi_bundle_update_hash:jedi_bundle_update_hash"
